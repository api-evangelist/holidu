aid: holidu
name: Holidu
description: >-
  Holidu is a Munich-based vacation-rental search engine and short-term-rental
  technology company that helps travellers find and book holiday homes and helps
  property owners and managers distribute their inventory. Holidu exposes a public
  Developer Hub with two production REST APIs: the Affiliate API, for searching
  offers, retrieving property details, checking real-time availability and syncing
  changes; and the Connectivity (provider) API, a v2 property-management surface of
  ~50 operations covering apartments, multi-unit listings, descriptions, photos,
  facilities, reviews, rates, length-of-stay pricing, availability, extra costs,
  discounts, booking terms, payment and cancellation configuration, and bookings.
  Authentication is via per-partner API keys (with an OAuth 2.0 security service and
  Bearer-JWT callbacks), sandbox and production hosts are separated, and Holidu runs
  a HackerOne bug-bounty program. Holidu is backed by EQT Ventures, HV Capital and
  Northzone.
